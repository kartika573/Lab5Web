<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Nilai Mahasiswa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="situs">
    <h1>Kalkulator Nilai Mahasiswa</h1>
    <p>Mini project Praktikum 5. Nilai akhir = tugas 30%, UTS 30%, UAS 40%.</p>
  </header>

  <main>
    <section class="latihan">
      <h2>Form Hitung Nilai</h2>
      <label for="tugas">Nilai tugas (0-100):</label>
      <input type="number" id="tugas" step="any">

      <label for="uts">Nilai UTS (0-100):</label>
      <input type="number" id="uts" step="any">

      <label for="uas">Nilai UAS (0-100):</label>
      <input type="number" id="uas" step="any">

      <button type="button" id="tombolHitung">Hitung nilai akhir</button>
      <button type="button" class="sekunder" id="tombolReset">Reset</button>

      <div class="hasil" id="hasilKalkulator" aria-live="polite"></div>
    </section>

    <section class="latihan">
      <h2>Skenario pengujian</h2>
      <p class="tujuan">Klik salah satu untuk mengisi form otomatis, lalu tekan Hitung.</p>
      <button type="button" class="sekunder" data-tugas="85" data-uts="78" data-uas="88">Skenario 1: 85, 78, 88</button>
      <button type="button" class="sekunder" data-tugas="60" data-uts="55" data-uas="62">Skenario 2: 60, 55, 62</button>
      <button type="button" class="sekunder" data-tugas="40" data-uts="30" data-uas="45">Skenario 3: 40, 30, 45</button>
    </section>
  </main>

  <footer>
    <p><a href="index.html">Kembali ke halaman latihan</a></p>
  </footer>

  <script src="kalkulator.js"></script>
</body>
</html>
